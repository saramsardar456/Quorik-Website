<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#030408"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)" opacity="0.15"/>
  <circle cx="950" cy="150" r="350" fill="#06B6D4" opacity="0.12" filter="blur(100px)"/>
  <circle cx="250" cy="500" r="300" fill="#2563EB" opacity="0.15" filter="blur(100px)"/>
  
  <!-- Outer border line -->
  <rect x="40" y="40" width="1120" height="550" rx="24" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Logo & Icon -->
  <g transform="translate(100, 140)">
    <rect width="90" height="90" rx="18" fill="#2563EB"/>
    <rect x="20" y="20" width="50" height="50" rx="8" fill="#07090F"/>
    <rect x="54" y="54" width="22" height="22" rx="4" fill="#06B6D4"/>
    <text x="120" y="62" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="52" letter-spacing="4">QUORIK</text>
  </g>
  
  <!-- Headline & Subtitle -->
  <text x="100" y="320" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="48">
    Custom Website Engineering &amp;
  </text>
  <text x="100" y="380" fill="#06B6D4" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="48">
    Autonomous AI Voice Agents
  </text>
  
  <text x="100" y="440" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="24">
    Convert visitors 24/7 with high-performance web architecture and AI receptionists.
  </text>
  
  <!-- Badges -->
  <g transform="translate(100, 490)">
    <rect x="0" y="0" width="220" height="42" rx="21" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)"/>
    <text x="110" y="26" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="700">✓ 24/7 VOICE AGENTS</text>
    
    <rect x="240" y="0" width="220" height="42" rx="21" fill="rgba(37,99,235,0.15)" stroke="rgba(37,99,235,0.4)"/>
    <text x="350" y="26" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="14" font-weight="700">⚡ 99+ LIGHTSPEED PERF</text>
    
    <rect x="480" y="0" width="220" height="42" rx="21" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.4)"/>
    <text x="590" y="26" text-anchor="middle" fill="#C084FC" font-family="monospace" font-size="14" font-weight="700">🤖 SMART AI CHATBOTS</text>
  </g>
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    </pattern>
  </defs>
</svg>
